run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - errcheck      # unchecked errors
    - govet         # suspicious constructs
    - staticcheck   # static analysis checks (includes SA, S1, ST1 families)
    - ineffassign   # assignments whose values are never used
    - misspell      # common spelling mistakes in comments and strings
    - godot         # comments should end with a period
    - unused        # unused code

linters-settings:
  godot:
    scope: declarations
    capital: false

issues:
  exclude-rules:
    - path: "_test\\.go"
      linters:
        - godot
    - text: "Error return value of .*(Close|Body.Close).*is not checked"
      linters:
        - errcheck

  max-issues-per-linter: 0
  max-same-issues: 0
