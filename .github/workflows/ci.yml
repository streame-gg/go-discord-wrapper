name: CI

permissions:
  contents: read

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

  test-race:
    name: Test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: go test -race
        run: go test -race -timeout 5m ./...

  doc-examples:
    name: Doc examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build doc-check tool
        run: go build -o /tmp/doc-check ./cmd/doc-check

      - name: Check doc examples compile
        run: /tmp/doc-check
