name: Go

permissions:
  contents: read

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "Unformatted files:"
            echo "$files"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.1

  test:
    name: Test
    runs-on: ubuntu-latest
    # Allow this job to push the regenerated COVERAGE.md back to master.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build
        run: go build -v ./...

      - name: Test with race detector and coverage
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage report
        run: go tool cover -func=coverage.out

      - name: Generate COVERAGE.md
        run: bash scripts/coverage-report.sh coverage.out COVERAGE.md

      # Commit the refreshed report only for pushes to master (never on PRs,
      # which may come from forks without write access). Pushes made with the
      # built-in GITHUB_TOKEN do not retrigger workflows, and "[skip ci]" is a
      # second safeguard against loops.
      - name: Commit COVERAGE.md
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add COVERAGE.md
          if git diff --staged --quiet; then
            echo "COVERAGE.md is up to date."
          else
            git commit -m "chore: update COVERAGE.md [skip ci]"
            git push
          fi

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
